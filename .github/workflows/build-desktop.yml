name: Build desktop exe

on:
  push:
    branches: [Rebuild]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # Windows 控制台默认 cp1252，Python print() 中文会 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run build-desktop.ps1
        shell: pwsh
        run: .\scripts\build-desktop.ps1

      - name: Upload exe + portable zip
        uses: actions/upload-artifact@v4
        with:
          name: honsen-wms-desktop-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
